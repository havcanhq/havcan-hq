<style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      outline: none;
    }
    body {
      background-color: #0c0a13;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    body.in-chat-mode {
      overflow: hidden !important;
      height: 100dvh !important;
    }
    body.showcase-viewer-open {
      overflow: hidden !important;
      height: 100dvh !important;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .app-screen {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      background: #FAF9FC;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0,0,0,0.7);
    }
    .app-screen.chat-viewport-locked {
      height: 100dvh !important;
      min-height: 100dvh !important;
      max-height: 100dvh !important;
      overflow: hidden !important;
      padding-bottom: 0 !important;
    }
    .view-anim {
      animation: nativePageTransition 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes nativePageTransition {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-press {
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.4, 1), background-color 0.15s ease;
      will-change: transform;
    }
    .btn-press:active {
      transform: scale(0.97);
    }
    button:active,
    a.btn-press:active,
    [role="button"]:active {
      transform: scale(0.97);
    }
    .has-tap-ripple {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }
    .tap-ripple {
      position: absolute !important;
      z-index: 0 !important;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(196,181,253,0.2) 42%, rgba(196,181,253,0) 74%);
      animation: tapRipple 0.46s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }
    .showcase-back-button {
      min-width: 44px;
      min-height: 44px;
    }
    .showcase-back-button .tap-ripple {
      background: radial-gradient(circle, rgba(124,58,237,0.28) 0%, rgba(167,139,250,0.2) 42%, rgba(196,181,253,0) 74%);
    }
    @keyframes tapRipple {
      0% { opacity: 0.72; transform: translate(-50%, -50%) scale(0); }
      58% { opacity: 0.3; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(4.6); }
    }
    .nav-btn {
      overflow: hidden;
      border-radius: 9999px;
    }
    .nav-tap-glass {
      position: absolute;
      left: 0;
      top: 0;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 3px 12px rgba(255,255,255,0.08);
      transform: translate(-50%, -50%) scale(0.45);
      animation: navTapGlass 0.62s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }
    @keyframes navTapGlass {
      0% { opacity: 0.72; transform: translate(-50%, -50%) scale(0.45); }
      52% { opacity: 0.32; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.75); }
    }

    /* =========================================================
       1. CONTINUOUS SINGLE-SURFACE NAVIGATION
       The dock and glass indicator stay in one coordinate system.
       ========================================================= */
    #bottom-bar-container {
      --nav-max-width: 350px;
      --nav-radius: 999px;
      --nav-padding-x: 8px;
      --nav-padding-y: 4px;
      --nav-blur: 18px;
      opacity: 0.96;
      filter: saturate(0.96);
      background-color: rgba(0, 0, 0, 0.96);
      border: 1px solid rgba(63, 63, 70, 0.95);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.84), 0 0 0 1px rgba(255,255,255,0.06);
      margin-left: auto;
      margin-right: auto;
      position: relative;
      max-width: var(--nav-max-width);
      padding: var(--nav-padding-y) var(--nav-padding-x);
      border-radius: var(--nav-radius);
      backdrop-filter: blur(var(--nav-blur));
      -webkit-backdrop-filter: blur(var(--nav-blur));
      will-change: max-width, border-radius, padding, filter, box-shadow, background-color;
      transition: max-width 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  border-radius 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  padding 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  filter 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  backdrop-filter 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  -webkit-backdrop-filter 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  opacity 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  box-shadow 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  background-color 0.38s ease;
    }
    #bottom-bar-container.nav-compact {
      --nav-max-width: 350px;
      --nav-radius: 9999px;
      --nav-padding-x: 8px;
      --nav-padding-y: 4px;
      --nav-blur: 18px;
    }
    #bottom-bar-container.nav-expanded {
      --nav-max-width: 394px;
      --nav-radius: 9999px;
      --nav-padding-x: 10px;
      --nav-padding-y: 6px;
      --nav-blur: 24px;
      opacity: 1;
      filter: saturate(1);
      background-color: rgba(12, 12, 15, 0.98);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255,255,255,0.08);
    }

    /* Active glass indicator: always measured relative to this nav surface. */
    #nav-capsule {
      position: absolute;
      top: var(--nav-padding-y);
      bottom: var(--nav-padding-y);
      left: 0;
      height: auto;
      background: rgba(39, 39, 42, 0.96);
      border: 1px solid rgba(82, 82, 91, 0.9);
      border-radius: 9999px;
      pointer-events: none;
      z-index: 1;
      will-change: transform, width, opacity, border-radius, filter, box-shadow;
      transform: translate3d(0, 0, 0);
      opacity: 1;
      filter: blur(0);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 5px 14px rgba(0,0,0,0.24);
      transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  width 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  top 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  bottom 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  border-radius 0.38s cubic-bezier(0.32, 0.72, 0, 1),
                  opacity 0.28s ease,
                  filter 0.38s ease,
                  box-shadow 0.38s ease;
    }
    #bottom-bar-container.nav-expanded #nav-capsule {
      border-radius: 9999px;
      filter: blur(0.1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 7px 18px rgba(0,0,0,0.3);
    }
    #nav-capsule::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 2.5px;
      background: #A855F7;
      border-radius: 9999px;
      opacity: 0.95;
    }

    .nav-btn {
      position: relative;
      z-index: 10;
      transition: transform 0.15s ease;
      min-height: 48px;
    }
    .nav-btn:active {
      transform: scale(0.92);
    }
    .nav-icon {
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), color 0.2s ease;
    }
    .nav-text {
      transition: opacity 0.25s ease, color 0.2s ease, transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      font-weight: 500;
      line-height: 1;
    }
    #standard-bottom-bar-shell {
      transition: opacity 0.26s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 0.32s cubic-bezier(0.32, 0.72, 0, 1),
                  visibility 0.26s ease;
    }
    #standard-bottom-bar-shell.nav-search-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-50%) translateY(18px);
    }
    #main-app-screen.search-layout-hidden {
      padding-bottom: 0 !important;
    }
    #app-view.search-route-enter {
      animation: searchSurfaceRise 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    #app-view.search-route-exit {
      animation: searchSurfaceDrop 0.2s cubic-bezier(0.4, 0, 1, 1) both;
    }
    @keyframes searchSurfaceRise {
      from { opacity: 0.72; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes searchSurfaceDrop {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0.72; transform: translateY(28px); }
    }

    #chat-messages-container {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    /* Photo Viewer Transition */
    #photo-viewer-modal {
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }
    #photo-viewer-modal.viewer-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #photo-viewer-modal.viewer-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    #photo-viewer-modal {
      z-index: 70 !important;
    }

    /* Full-screen showcase viewer: one service-scoped horizontal track. */
    #showcase-viewer {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(12, 10, 19, 0.72);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(100%);
      transition: opacity 0.24s cubic-bezier(0.32, 0.72, 0, 1),
                  transform 0.3s cubic-bezier(0.32, 0.72, 0, 1),
                  visibility 0s linear 0.3s;
    }
    #showcase-viewer.showcase-viewer-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 0s;
    }
    #showcase-viewer-shell {
      position: relative;
      width: min(100%, 420px);
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: #FAF9FC;
      display: flex;
      flex-direction: column;
    }
    #showcase-track-viewport {
      min-height: 0;
      flex: 0 0 auto;
      overflow-x: hidden;
      overflow-y: hidden;
      touch-action: pan-y;
      overscroll-behavior-x: contain;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    #showcase-track-viewport:active {
      cursor: grabbing;
    }
    #showcase-track {
      display: flex;
      width: 100%;
      height: auto;
      align-items: flex-start;
      transform: translate3d(0, 0, 0);
      transition: transform 0.28s cubic-bezier(0.22, 0.75, 0.2, 1);
      will-change: transform;
    }
    #showcase-track.is-dragging {
      transition: none;
    }
    .showcase-slide {
      flex: 0 0 100%;
      min-width: 0;
      height: auto;
      overflow: visible;
      padding: 0.85rem 1rem 0;
      -webkit-overflow-scrolling: touch;
    }
    #showcase-details-scroll {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0 1rem 6.5rem;
    }
    #showcase-static-details {
      padding-top: 0.9rem;
    }
    .showcase-preview-button {
      display: block;
      width: 100%;
      overflow: hidden;
      border-radius: 1rem;
      background: transparent;
      box-shadow: none;
    }
    .showcase-preview-button img {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(60dvh, 460px);
      object-fit: contain;
      background: transparent;
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.4, 1);
    }
    .showcase-preview-button:active img {
      transform: scale(0.985);
    }
    .showcase-related-strip {
      border-top: 1px solid rgba(221, 214, 232, 0.72);
      padding-top: 0.9rem;
    }
    .showcase-related-card {
      width: 132px;
      flex: 0 0 132px;
      overflow: hidden;
      border-radius: 0.9rem;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(234, 230, 240, 0.9);
      text-align: left;
    }
    .showcase-related-card img {
      display: block;
      width: 100%;
      height: 72px;
      object-fit: contain;
      background: #f4f1f8;
    }
    #showcase-chat-fab {
      position: absolute;
      right: 1rem;
      bottom: max(1.1rem, env(safe-area-inset-bottom));
      z-index: 4;
      min-width: 112px;
      height: 58px;
      padding: 0 0.85rem 0 0.55rem;
      border-radius: 1.15rem;
      background: #160c27;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      box-shadow: 0 12px 28px rgba(36, 16, 65, 0.32), 0 0 0 1px rgba(255,255,255,0.12);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.4, 1),
                  box-shadow 0.18s ease,
                  background-color 0.18s ease;
    }
    #showcase-chat-fab:hover {
      background: #24103e;
      box-shadow: 0 14px 32px rgba(36, 16, 65, 0.38), 0 0 0 1px rgba(255,255,255,0.16);
    }
    #showcase-chat-fab img {
      width: 34px;
      height: 34px;
      padding: 0.25rem;
      border-radius: 0.7rem;
      background: white;
      object-fit: contain;
    }

     /* =========================================================
        2. PROJECT WORKSPACE
        Quiet surfaces and soft layers replace order-history cards.
        ========================================================= */
     .project-page {
       color: #1b1329;
       animation: projectPageIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
     }
     @keyframes projectPageIn {
       from { opacity: 0; transform: translateY(5px); }
       to { opacity: 1; transform: translateY(0); }
     }
     .project-kicker {
       color: #7c3aed;
       font-size: 9px;
       line-height: 1;
       font-weight: 800;
       letter-spacing: 0.16em;
       text-transform: uppercase;
     }
     .project-page-title {
       color: #170b28;
       font-size: 21px;
       line-height: 1.16;
       letter-spacing: -0.045em;
       font-weight: 800;
     }
     .project-page-subtitle {
       color: #766b83;
       font-size: 11px;
       line-height: 1.5;
       max-width: 310px;
     }
     .project-list-summary {
       display: inline-flex;
       align-items: center;
       gap: 6px;
       color: #6b21a8;
       background: #f0e8fb;
       border-radius: 999px;
       padding: 6px 9px;
       font-size: 10px;
       line-height: 1;
       font-weight: 800;
     }
     .project-list-summary::before {
       content: '';
       width: 6px;
       height: 6px;
       border-radius: 999px;
       background: #a855f7;
       box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
     }
     .project-list {
       display: grid;
       gap: 9px;
     }
     .project-row {
       display: block;
       width: 100%;
       padding: 13px 13px 12px;
       text-align: left;
       border: 0;
       border-radius: 18px;
       background: rgba(255,255,255,0.82);
       box-shadow: 0 8px 22px rgba(73, 42, 104, 0.06);
       transition: transform 0.18s cubic-bezier(0.2,0.8,0.4,1),
                   background-color 0.18s ease,
                   box-shadow 0.18s ease;
     }
     .project-row:hover {
       background: #ffffff;
       box-shadow: 0 11px 28px rgba(73, 42, 104, 0.1);
     }
     .project-row:active {
       transform: scale(0.987);
     }
     .project-row-head {
       display: flex;
       align-items: flex-start;
       justify-content: space-between;
       gap: 10px;
     }
     .project-service {
       display: flex;
       min-width: 0;
       align-items: center;
       gap: 9px;
     }
     .project-service-icon {
       display: inline-flex;
       width: 31px;
       height: 31px;
       flex: 0 0 31px;
       align-items: center;
       justify-content: center;
       border-radius: 11px;
       color: #6d28d9;
       background: #f0e8fb;
     }
     .project-service-icon svg {
       width: 15px;
       height: 15px;
       stroke-width: 2.2;
     }
     .project-service-name {
       overflow: hidden;
       color: #241531;
       font-size: 12px;
       line-height: 1.25;
       font-weight: 800;
       text-overflow: ellipsis;
       white-space: nowrap;
     }
     .project-service-type {
       margin-top: 3px;
       color: #988da3;
       font-size: 9px;
       line-height: 1;
       font-weight: 700;
     }
     .project-status {
       display: inline-flex;
       flex: 0 0 auto;
       align-items: center;
       gap: 5px;
       border-radius: 999px;
       padding: 6px 8px;
       font-size: 9px;
       line-height: 1;
       font-weight: 800;
       white-space: nowrap;
     }
     .project-status::before {
       content: '';
       width: 5px;
       height: 5px;
       border-radius: 999px;
       background: currentColor;
     }
     .project-status-pending { color: #8260a7; background: #f1ebfa; }
     .project-status-confirmed { color: #256b76; background: #e6f5f3; }
     .project-status-in-progress { color: #6d28d9; background: #eee7ff; }
     .project-status-quality-check { color: #9a5b13; background: #fff3df; }
     .project-status-client-review { color: #2864a0; background: #e7f1fc; }
     .project-status-revision { color: #a0447a; background: #fbeaf4; }
     .project-status-completed { color: #22734f; background: #e6f6ec; }
     .project-row-meta {
       display: flex;
       align-items: center;
       gap: 9px;
       margin: 12px 0 10px 40px;
       color: #8b8094;
       font-size: 9px;
       line-height: 1;
       font-weight: 700;
     }
     .project-row-meta span {
       display: inline-flex;
       align-items: center;
       gap: 4px;
     }
     .project-row-meta svg {
       width: 11px;
       height: 11px;
       color: #a89ab4;
     }
     .project-progress-line {
       display: flex;
       align-items: center;
       gap: 8px;
       margin-left: 40px;
     }
     .project-progress-track {
       height: 5px;
       flex: 1;
       overflow: hidden;
       border-radius: 999px;
       background: #eeeaf2;
     }
     .project-progress-fill {
       height: 100%;
       border-radius: inherit;
       background: linear-gradient(90deg, #9b6be8, #6d28d9);
       transition: width 0.35s cubic-bezier(0.2,0.8,0.4,1);
     }
     .project-progress-value {
       min-width: 30px;
       color: #6d28d9;
       font-size: 10px;
       line-height: 1;
       font-weight: 800;
       text-align: right;
     }
     .project-detail-page {
       padding-bottom: 48px;
     }
     .project-back {
       display: inline-flex;
       align-items: center;
       gap: 5px;
       padding: 3px 0;
       color: #766b83;
       font-size: 10px;
       line-height: 1;
       font-weight: 800;
       transition: color 0.16s ease, transform 0.16s ease;
     }
     .project-back:hover { color: #32115e; }
     .project-back:active { transform: translateX(-2px); }
     .project-detail-heading {
       display: flex;
       align-items: center;
       gap: 10px;
       margin-top: 14px;
     }
     .project-detail-heading .project-service-icon {
       width: 39px;
       height: 39px;
       flex-basis: 39px;
       border-radius: 13px;
       background: #e9ddfb;
     }
     .project-detail-heading .project-service-icon svg {
       width: 18px;
       height: 18px;
     }
     .project-detail-heading h1 {
       color: #170b28;
       font-size: 16px;
       line-height: 1.15;
       font-weight: 800;
       letter-spacing: -0.03em;
     }
     .project-detail-heading p {
       margin-top: 4px;
       color: #91859c;
       font-size: 10px;
       line-height: 1;

    function syncTopHeaderMorph() {
      const standardHeader = document.getElementById('top-nav-standard');
      const searchHeader = document.getElementById('top-nav-search');
      const chatHeader = document.getElementById('top-nav-chat');
      const titleEl = document.getElementById('chat-header-title');
      const subtitleEl = document.getElementById('chat-header-subtitle');
      const appScreen = document.getElementById('main-app-screen');

      const isChat = state.currentRoute === 'chat';
      const isSearch = state.currentRoute === 'search';

      // Hide panels smoothly
      [standardHeader, searchHeader, chatHeader].forEach(panel => {
        if (panel) {
          panel.classList.remove('panel-active');
          panel.classList.add('panel-hidden');
        }
      });

      if (isChat) {
        document.body.classList.add('in-chat-mode');
        if (appScreen) appScreen.classList.add('chat-viewport-locked');
        if (chatHeader) {
          chatHeader.classList.remove('panel-hidden');
          chatHeader.classList.add('panel-active');
        }
        const activeOrder = state.orders.find(o => o.id === state.activeOrderId) || state.orders[0];
        if (activeOrder && titleEl && subtitleEl) {
          titleEl.innerText = activeOrder.serviceTitle ? `HAVCAN • ${activeOrder.serviceTitle}` : 'HAVCAN Creative Lead';
          subtitleEl.innerText = `Supervised • Order #${activeOrder.id} (${activeOrder.status})`;
        }
      } else if (isSearch) {
        document.body.classList.remove('in-chat-mode');
        if (appScreen) appScreen.classList.remove('chat-viewport-locked');
        if (searchHeader) {
          searchHeader.classList.remove('panel-hidden');
          searchHeader.classList.add('panel-active');
        }
        const input = document.getElementById('global-search-input');
        if (input) {
          input.value = state.searchQuery;
          const clearBtn = document.getElementById('search-clear-btn');
          if (clearBtn) clearBtn.classList.toggle('hidden', !state.searchQuery);
          // Auto-focus immediately without jumping
          setTimeout(() => {
            input.focus();
            if (input.setSelectionRange) {
              const len = input.value.length;
              input.setSelectionRange(len, len);
            }
          }, 60);
        }
      } else {
        document.body.classList.remove('in-chat-mode');
        if (appScreen) appScreen.classList.remove('chat-viewport-locked');
        if (standardHeader) {
          standardHeader.classList.remove('panel-hidden');
          standardHeader.classList.add('panel-active');
        }
      }
    }

    // A single point-origin ripple keeps tap feedback attached to the control
    // that was actually touched, including nav icons and showcase actions.
    function createTapRipple(event) {
      const target = event.target.closest('button, a, [role="button"], .btn-press');
      if (!target || target.disabled || target.getAttribute('aria-disabled') === 'true') return;
      if (target.closest('.nav-btn')) return;
      const rect = target.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      target.classList.add('has-tap-ripple');
      const ripple = document.createElement('span');
      ripple.className = 'tap-ripple';
      ripple.style.left = `${event.clientX - rect.left}px`;
      ripple.style.top = `${event.clientY - rect.top}px`;
      target.appendChild(ripple);
      window.setTimeout(() => ripple.remove(), 520);
    }

    function createNavTapGlass(button, event) {
      if (!button || !event) return;
      button.querySelector('.nav-tap-glass')?.remove();
      const rect = button.getBoundingClientRect();
      const glass = document.createElement('span');
      glass.className = 'nav-tap-glass';
      glass.style.left = `${event.clientX - rect.left}px`;
      glass.style.top = `${event.clientY - rect.top}px`;
      button.appendChild(glass);
      window.setTimeout(() => glass.remove(), 700);
    }

    // =========================================================
    // 6. NAVIGATION EXPANSION & CIRCULAR/CAPSULE GLASS EFFECT (FIX ROOT CAUSE)
    // =========================================================
    function getNavIndexForRoute(route) {
      if (route === 'home') return 0;
      if (route === 'search') return 1;
      if (route === 'orders' || route === 'order-detail') return 2;
      if (route === 'chat') return 3;
      if (route === 'profile') return 4;
      return null;
    }

    function setNavExpanded(expanded) {
      const bar = document.getElementById('bottom-bar-container');
      if (!bar) return;
      bar.classList.toggle('nav-expanded', expanded);
      bar.classList.toggle('nav-compact', !expanded);
      requestAnimationFrame(() => updateBottomBarPosition(true));
    }
    function expandNavBar() {
      const bar = document.getElementById('bottom-bar-container');
      if (bar && !bar.classList.contains('nav-expanded')) setNavExpanded(true);
    }
    function collapseNavBar() {
      const bar = document.getElementById('bottom-bar-container');
      if (bar && !bar.classList.contains('nav-compact')) setNavExpanded(false);
    }
    let navCollapseTimer = null;
    function delayedCollapseNavBar(delay = 1800) {
      if (navCollapseTimer) clearTimeout(navCollapseTimer);
      navCollapseTimer = setTimeout(collapseNavBar, delay);
    }

    function handleNavPointerDown(index, event) {
      state.navActiveIndex = index;
      createNavTapGlass(document.querySelector(`.nav-btn[data-index="${index}"]`), event);
      expandNavBar();
      delayedCollapseNavBar(900);
      updateBottomBarPosition(true);
    }

    function handleNavClick(route, index) {
      state.navActiveIndex = index;
      state.navTapIndex = index;
      expandNavBar();
      navigateTo(route);
      delayedCollapseNavBar(900);
    }

    function updateBottomBarPosition(animate = true) {
      const standardShell = document.getElementById('standard-bottom-bar-shell');
      const navContainer = document.getElementById('bottom-bar-container');
      const navButtons = document.querySelectorAll('.nav-btn');
      const capsule = document.getElementById('nav-capsule');
      const appScreen = document.getElementById('main-app-screen');

      if (!navContainer || !capsule || navButtons.length === 0) return;
      if (appScreen) appScreen.classList.toggle('search-layout-hidden', state.currentRoute === 'search');

      if (state.currentRoute === 'chat') {
        if (standardShell) {
          standardShell.classList.add('nav-search-hidden');
          standardShell.style.display = '';
        }
        return;
      } else {
        if (standardShell) {
          standardShell.style.display = '';
          standardShell.classList.toggle('nav-search-hidden', state.currentRoute === 'search');
        }
      }

       const activeIndex = Number.isInteger(state.navActiveIndex)
         ? state.navActiveIndex
         : (getNavIndexForRoute(state.currentRoute) || 0);

      navButtons.forEach((btn, idx) => {
        const icon = btn.querySelector('.nav-icon');
        const text = btn.querySelector('.nav-text');
        if (idx === activeIndex) {
          btn.classList.add('is-active', 'text-white');
          btn.classList.remove('text-zinc-400');
          if (icon) icon.classList.add('scale-110', 'text-white');
          if (text) { text.classList.add('font-bold', 'text-white'); text.classList.remove('text-zinc-400'); }
        } else {
          btn.classList.remove('is-active', 'text-white');
          btn.classList.add('text-zinc-400');
          if (icon) icon.classList.remove('scale-110', 'text-white');
          if (text) { text.classList.remove('font-bold', 'text-white'); text.classList.add('text-zinc-400'); }
        }
      });

      const activeBtn = navButtons[activeIndex];
      if (activeBtn) {
        const navRect = navContainer.getBoundingClientRect();
        const activeRect = activeBtn.getBoundingClientRect();
        const targetCenterX = (activeRect.left + activeRect.width / 2) - navRect.left;
         const targetWidth = Math.max(50, Math.min(activeBtn.offsetWidth - 6, 76));
        const finalLeftOffset = targetCenterX - (targetWidth / 2);

        capsule.style.width = `${targetWidth}px`;
        capsule.style.transform = `translate3d(${finalLeftOffset}px, 0, 0)`;
      }
    }

    function navigateTo(route, param = null) {
      const wasSearch = state.currentRoute === 'search';
      if (state.navTapIndex === null) {
        const routeIndex = getNavIndexForRoute(route);
        if (routeIndex !== null) state.navActiveIndex = routeIndex;
      }
      state.navTapIndex = null;
      if (state.currentRoute !== route) {
        state.previousRoute = state.currentRoute;
      }
      state.currentRoute = route;

      if (route === 'order-detail' && param) state.activeOrderId = param;
      if (route === 'chat' && param) state.activeOrderId = param;

      window.scrollTo({ top: 0, behavior: 'instant' });
      syncTopHeaderMorph();
      const appView = document.getElementById('app-view');
      const finishNavigation = () => {
        renderApp();
        updateBottomBarPosition(true);
        const renderedView = document.getElementById('app-view');
        if (renderedView) {
          renderedView.classList.remove('search-route-enter', 'search-route-exit');
          if (route === 'search' && !wasSearch) {
            requestAnimationFrame(() => renderedView.classList.add('search-route-enter'));
          }
        }
        if (route === 'chat') {
          setTimeout(scrollWhatsAppMessagesToBottom, 60);
        }
      };

      if (wasSearch && route !== 'search' && appView) {
        appView.classList.remove('search-route-enter');
        appView.classList.add('search-route-exit');
        updateBottomBarPosition(true);
        setTimeout(() => {
          if (state.currentRoute === route) finishNavigation();
        }, 200);
      } else {
        finishNavigation();
      }
    }

    function goBack() {
      if (state.previousRoute && state.previousRoute !== 'chat') {
        navigateTo(state.previousRoute);
      } else {
        navigateTo('home');
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Highlighting helper for search queries
    function highlightQueryMatch(text, query) {
      if (!query) return escapeHtml(text);
      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQuery})`, 'gi');
      return escapeHtml(text).replace(regex, '<mark class="bg-purple-200 text-purple-950 font-extrabold px-0.5 rounded">$1</mark>');
    }

    function applyShowcaseTrackPosition(animate = true, dragOffset = 0) {
      const track = document.getElementById('showcase-track');
      if (!track) return;
      track.classList.toggle('is-dragging', !animate);
      const index = state.showcaseViewer.activeIndex || 0;
      track.style.transform = `translate3d(calc(-${index * 100}% + ${dragOffset}px), 0, 0)`;
    }

    function setShowcaseIndex(nextIndex) {
      const total = state.showcaseViewer.items.length;
      if (!total) return;
      state.showcaseViewer.activeIndex = Math.max(0, Math.min(nextIndex, total - 1));
      const work = state.showcaseViewer.items[state.showcaseViewer.activeIndex];
      if (work) recordRecentlyViewedShowcase(work.id);
      const count = document.getElementById('showcase-viewer-count');
      if (count) count.innerText = `${state.showcaseViewer.activeIndex + 1} / ${total}`;
      renderShowcaseDetails();
      applyShowcaseTrackPosition(true);
    }

    function setupShowcaseGestures() {
      const viewport = document.getElementById('showcase-track-viewport');
      const track = document.getElementById('showcase-track');
      if (!viewport || !track) return;

      viewport.onpointerdown = event => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        if (event.target.closest('.showcase-related-strip')) return;
        showcaseGesture = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          offsetX: 0,
          dragging: false
        };
      };

      viewport.onpointermove = event => {
        if (!showcaseGesture || showcaseGesture.pointerId !== event.pointerId) return;
        const dx = event.clientX - showcaseGesture.startX;
        const dy = event.clientY - showcaseGesture.startY;
        if (!showcaseGesture.dragging) {
          if (Math.abs(dy) > Math.abs(dx) || Math.abs(dx) < 8) return;
          showcaseGesture.dragging = true;
          track.classList.add('is-dragging');
          viewport.setPointerCapture?.(event.pointerId);
        }
        if (event.cancelable) event.preventDefault();
        showcaseGesture.offsetX = dx;
        const atStart = state.showcaseViewer.activeIndex === 0 && dx > 0;
        const atEnd = state.showcaseViewer.activeIndex === state.showcaseViewer.items.length - 1 && dx < 0;
        const resistance = atStart || atEnd ? 0.28 : 1;
        applyShowcaseTrackPosition(false, dx * resistance);
      };

      const finishGesture = event => {
        if (!showcaseGesture || showcaseGesture.pointerId !== event.pointerId) return;
        const gesture = showcaseGesture;
        showcaseGesture = null;
        const dx = gesture.offsetX;
        if (gesture.dragging) {
          showcaseSuppressClickUntil = Date.now() + 350;
          const threshold = Math.max(44, (viewport.clientWidth || 320) * 0.16);
          if (Math.abs(dx) > threshold) {
            setShowcaseIndex(state.showcaseViewer.activeIndex + (dx < 0 ? 1 : -1));
          } else {
            applyShowcaseTrackPosition(true);
          }
        } else {
          applyShowcaseTrackPosition(true);
        }
        track.classList.remove('is-dragging');
      };

      viewport.onpointerup = finishGesture;
      viewport.onpointercancel = finishGesture;
    }

    function openShowcaseViewer(serviceId, showcaseId = 0) {
      const items = SHOWCASE_WORK.filter(work => work.serviceId === serviceId);
      if (!items.length) return;
      const selectedIndex = typeof showcaseId === 'number'
        ? Math.max(0, Math.min(showcaseId, items.length - 1))
        : Math.max(0, items.findIndex(work => work.id === showcaseId));
      state.showcaseViewer = {
        serviceId,
        items,
        activeIndex: selectedIndex
      };
      const activeWork = items[selectedIndex];
      if (activeWork) {
        recordRecentlyViewedShowcase(activeWork.id);
        if (state.searchQuery.trim()) recordSearchQuery();

      renderShowcaseViewer();
      const viewer = document.getElementById('showcase-viewer');

        viewer.classList.add('showcase-viewer-active');
      }
      document.body.classList.add('showcase-viewer-open');
      setupShowcaseGestures();
    }

    function renderServiceCard(srv, isCarousel = false) {

    const PROJECT_STAGES = [
      { key: 'Payment', icon: 'wallet-cards' },
      { key: 'Confirmed', icon: 'badge-check' },
      { key: 'In Progress', icon: 'pencil-ruler' },
      { key: 'Quality Check', icon: 'scan-search' },
      { key: 'Client Review', icon: 'eye' },
      { key: 'Revision', icon: 'refresh-cw' },
      { key: 'Completed', icon: 'check-check' }
    ];

    const PROJECT_STATUS_INDEX = {
      'Pending': 0,
      'Confirmed': 1,
      'In Progress': 2,
      'Quality Check': 3,
      'Client Review': 4,
      'Revision': 5,
      'Completed': 6
    };

    function getProjectService(order) {
      return state.services.find(service => service.id === order.serviceId) || {
        title: order.serviceTitle || 'HAVCAN Project',
        category: 'Managed Service',
        image: ''
      };
    }

    function getProjectIcon(order) {
      const category = (getProjectService(order).category || '').toLowerCase();
      if (category.includes('video')) return 'clapperboard';
      if (category.includes('development')) return 'code-2';
      if (category.includes('presentation')) return 'presentation';
      if (category.includes('design')) return 'pen-tool';
      return 'sparkles';
    }

    function getProjectStatus(order) {
      return PROJECT_STATUS_INDEX[order.status] !== undefined ? order.status : 'Pending';
    }

    function getProjectStageIndex(order) {
      return PROJECT_STATUS_INDEX[getProjectStatus(order)];
    }

    function getProjectProgress(order) {
      const progressByStatus = {
        'Pending': 8,
        'Confirmed': 24,
        'In Progress': 46,
        'Quality Check': 64,
        'Client Review': 80,
        'Revision': 73,
        'Completed': 100
      };
      return progressByStatus[getProjectStatus(order)] || 8;
    }

    function getProjectStatusClass(status) {
      return `project-status-${status.toLowerCase().replace(/\s+/g, '-')}`;
    }

    function getProjectDate(order) {
      return order.createdAt || order.date || 'Recently started';
    }

    function getProjectFiles(order) {
      return order.uploadedFiles || [
        { name: 'Project brief', meta: 'Received' },
        { name: 'Reference material', meta: 'On file' }
      ];
    }

    function renderProjectStatus(order, extraClass = '') {
      const status = getProjectStatus(order);
      return `<span class="project-status ${getProjectStatusClass(status)} ${extraClass}">${status}</span>`;
    }

    function renderOrders() {
      return `
        <div class="project-page project-list-page pb-12">
          <div class="flex items-end justify-between gap-3">

              const progress = getProjectProgress(order);
              const service = getProjectService(order);
              return `
                <button type="button" onclick="navigateTo('order-detail', '${order.id}')" class="project-row btn-press" aria-label="Open ${service.title} project">

                        <span class="project-service-type block">${service.category || 'Managed project'}</span>
                      </span>

                    ${renderProjectStatus(order)}

                  <div class="project-row-meta">
                    <span><i data-lucide="hash"></i>${order.id}</span>
                    <span><i data-lucide="calendar-days"></i>${getProjectDate(order)}</span>
                  </div>
                  <div class="project-progress-line">
                    <div class="project-progress-track" aria-label="${progress}% complete">
                      <div class="project-progress-fill" style="width:${progress}%"></div>
                    </div>
                    <span class="project-progress-value">${progress}%</span>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderProjectStage(order, stage, index) {
      const currentIndex = getProjectStageIndex(order);
      const stageState = index < currentIndex ? 'is-complete' : (index === currentIndex ? 'is-current' : '');
      const stageMeta = index === currentIndex ? 'Current' : (index < currentIndex ? 'Done' : '');
      return `
        <div class="project-stage ${stageState}">
          <span class="project-stage-dot">
            <i data-lucide="${index < currentIndex ? 'check' : stage.icon}"></i>
          </span>
          <span class="project-stage-label">${stage.key}</span>
          ${stageMeta ? `<span class="project-stage-meta">${stageMeta}</span>` : ''}
        </div>
      `;
    }

    function renderProjectInfoSection(title, icon, content, extraClass = '') {
      return `
        <section class="project-info-section ${extraClass}">
          <h3 class="project-info-title"><i data-lucide="${icon}"></i>${title}</h3>
          ${content}
        </section>
      `;
    }

    function renderOrderDetail() {

      if (!order) {
        return `
          <div class="project-page project-detail-page">

      const files = getProjectFiles(order);

      return `
        <div class="project-page project-detail-page">

          <div class="project-detail-heading">
            <span class="project-service-icon"><i data-lucide="${getProjectIcon(order)}"></i></span>
            <span class="min-w-0">
              <h1 class="truncate">${service.title || order.serviceTitle}</h1>
              <p>Managed project workspace</p>
            </span>
          </div>

          <section class="project-overview">
            <div class="project-overview-top">

              ${renderProjectStatus(order)}

            <div class="project-overview-progress">
              <div>
                <strong>${progress}%</strong>
                <span>${status}</span>
              </div>
              <p class="project-overview-date">${getProjectDate(order)}<br>${order.deadline || 'Managed delivery'}</p>
            </div>
            <div class="project-overview-track"><span style="width:${progress}%"></span></div>
          </section>

          <section class="project-section">
            <div class="project-section-heading">
              <h2>Progress Timeline</h2>
              <span>${currentIndex + 1} of ${PROJECT_STAGES.length} stages</span>
            </div>
            <div class="project-surface project-timeline">
              <div class="project-timeline-rail"><span style="height:${timelineProgress}%"></span></div>
              ${PROJECT_STAGES.map((stage, index) => renderProjectStage(order, stage, index)).join('')}
            </div>
          </section>

          <section class="project-section">
            <div class="project-section-heading">
              <h2>Project Information</h2>
              <span>Always available</span>
            </div>
            <div class="project-info-grid">
              ${renderProjectInfoSection(
                'Requirements / Brief',
                'file-pen-line',
                `<p class="project-info-copy">${order.requirements || 'Your brief is being reviewed by the HAVCAN team.'}</p>`,
                'is-wide'
              )}
              ${renderProjectInfoSection(
                'Uploaded Files',
                'paperclip',
                `<div class="project-file-list">${files.map(file => `
                  <div class="project-file">
                    <i data-lucide="${file.icon || 'file-text'}"></i>
                    <span>${file.name || file.title || 'Project file'}</span>
                    <small>${file.meta || 'Available'}</small>
                  </div>
                `).join('')}</div>`
              )}
              ${renderProjectInfoSection(
                'Deliverables',
                'package-check',
                `<p class="project-info-copy">${order.deliverables || 'Final project files and handoff notes will appear here.'}</p>`
              )}
              ${renderProjectInfoSection(
                'Messages',
                'message-square',
                `<p class="project-info-copy">Keep decisions and feedback with your managed creative lead.</p>
                 <button type="button" onclick="navigateTo('chat', '${order.id}')" class="project-action btn-press">
                   <i data-lucide="arrow-up-right"></i><span>Open messages</span>
                 </button>`
              )}
              ${renderProjectInfoSection(
                'Delivery',
                'send',
                `<p class="project-info-copy">${order.deliveryNote || `Managed handoff is planned within ${order.deadline || 'the agreed timeline'}.`}</p>`
              )}
              ${renderProjectInfoSection(
                'Revision information',
                'refresh-cw',
                `<p class="project-info-copy">${order.revisionInfo || 'Feedback and included revisions are coordinated in the WhatsApp inbox.'}</p>`
              )}
              ${renderProjectInfoSection(
                'Review',
                'star',
                `<p class="project-info-copy">${order.reviewInfo || 'Your review becomes available after delivery.'}</p>`
              )}
            </div>
          </section>
        </div>
      `;
    }

    function renderProfile() {
      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-surface-border p-4 shadow-xs flex items-center space-x-3">
            <div class="w-14 h-14 rounded-2xl bg-purple-50 flex items-center justify-center p-2 border border-purple-100 shadow-sm">
              <img alt="HAVCAN" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrkGpAAXYgqmiPJT59rNcAhrsCWZnwgrtrQ2Hr5F6cXr7BDxw-tzwFtX8xHYQOhBSiR-RGXy9DQxv22YeEX4gN9YtPoDKfm7whDsFXJFWBj6VtKAH6nFUFJFtI8jaeANLQ-DvBbux1apaMbaS_ks5iS4PPiH1_D-NIUVGdXccO9PRUtbTSNAlmXQyyHI9Uyj1Irhm1MTUUfpt0OwqinuTWiSzbE-1R7UmhaRPH8wM-AbnYV6hY-Ch81Bv9zAv51pJJaw"/>
            </div>
            <div class="flex-1">
              <div class="flex items-center space-x-1.5">
                <h2 class="font-extrabold text-sm text-slate-900">${state.currentUser.name}</h2>

              <div class="flex items-center space-x-2.5">

    function openServiceDetailModal(serviceId) {
      openShowcaseViewer(serviceId, 0);
    }

    function openServiceChat(serviceId, showcaseId = null) {
      const srv = state.services.find(s => s.id === serviceId);
      if (!srv) return;
      const matchingOrder = state.orders.find(order => order.serviceId === serviceId);
      const showcase = showcaseId ? SHOWCASE_WORK.find(work => work.id === showcaseId) : null;
      state.whatsappContextServiceId = serviceId;
      state.whatsappContextShowcaseId = showcase ? showcase.id : null;
      closeShowcaseViewer();
      navigateTo('chat', matchingOrder ? matchingOrder.id : null);
    }

    function renderApp() {
      const appView = document.getElementById('app-view');
      let content = '';
      switch (state.currentRoute) {
        case 'home': content = renderHome(); break;
        case 'search': content = renderSearch(); break;
        case 'orders': content = renderOrders(); break;
        case 'order-detail': content = renderOrderDetail(); break;
        case 'chat': content = renderWhatsAppInbox(); break;
        case 'profile': content = renderProfile(); break;
        default: content = renderHome();
      }
      appView.innerHTML = content;
      lucide.createIcons();
      requestAnimationFrame(() => updateBottomBarPosition(false));
      if (state.currentRoute === 'chat') {
        startWhatsAppPolling();
        if (!state.whatsapp.status && !state.whatsapp.loading) loadWhatsAppInbox();
      } else {
        stopWhatsAppPolling();
      }
    }

    /*
     * WhatsApp inbox integration.
     * The visual shell above remains the original HAVCAN conversation surface;
     * only its data source is replaced with the shared server API.
     */
    const HAVCAN_API_BASE_URL = String(
      (window.HAVCAN_CONFIG && window.HAVCAN_CONFIG.apiBaseUrl)
        || document.querySelector('meta[name="havcan-api-base-url"]')?.getAttribute('content')
        || ''
    ).replace(/\/+$/, '');

    function whatsappRequest(url, options = {}) {
      const requestUrl = `${HAVCAN_API_BASE_URL}${url}`;
      return fetch(requestUrl, {
        credentials: 'include',
        ...options,
        headers: { 'Accept': 'application/json', ...(options.headers || {}) }
      }).then(async response => {
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(payload && (payload.message || payload.error) || `Request failed (${response.status})`);
        }
        return payload;
      });
    }

    function whatsappActiveConversation() {
      return state.whatsapp.conversations.find(item => item.id === state.whatsapp.activeConversationId)
        || state.whatsapp.conversations[0]
        || null;
    }

    function whatsappTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function whatsappStatusCopy() {
      const status = state.whatsapp.status;
      if (!status) return 'Connecting to WhatsApp';
      if (!status.configured) return 'WhatsApp is not configured';
      if (!status.connected) return 'WhatsApp is offline';
      return 'WhatsApp Business connected';
    }

    function renderWhatsAppSkeleton() {
      return `
        <div class="space-y-2.5 animate-pulse">
          <div class="h-16 rounded-2xl bg-white border border-purple-100"></div>
          <div class="h-16 rounded-2xl bg-white border border-purple-100"></div>
          <div class="h-16 rounded-2xl bg-white border border-purple-100"></div>
        </div>
      `;
    }

    function renderWhatsAppConversationList() {
      const conversations = state.whatsapp.conversations;
      if (!conversations.length) {
        return `
          <div class="rounded-2xl bg-white border border-surface-border p-5 text-center shadow-xs">
            <div class="w-11 h-11 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center mx-auto mb-2">
              <i data-lucide="message-circle" class="w-5 h-5"></i>
            </div>
            <h3 class="text-xs font-extrabold text-slate-900">No WhatsApp conversations</h3>
            <p class="text-[11px] text-surface-muted leading-relaxed mt-1">New customer messages will appear here when they arrive.</p>
          </div>
        `;
      }
      return `
        <div class="space-y-1.5">
          ${conversations.map(conversation => {
            const active = conversation.id === state.whatsapp.activeConversationId;
            return `
              <button type="button" onclick="selectWhatsAppConversation('${escapeHtml(conversation.id)}')" class="btn-press w-full text-left rounded-2xl p-3 ${active ? 'bg-purple-50 border-purple-200' : 'bg-white border-surface-border'} border shadow-2xs flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-xl ${active ? 'bg-purple-200 text-purple-900' : 'bg-emerald-50 text-emerald-700'} flex items-center justify-center flex-shrink-0">
                  <i data-lucide="user-round" class="w-4 h-4"></i>
                </span>
                <span class="min-w-0 flex-1">
                  <span class="flex items-center justify-between gap-2">
                    <span class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(conversation.displayName || conversation.waId)}</span>
                    <span class="text-[9px] text-slate-400 flex-shrink-0">${whatsappTime(conversation.lastMessageAt)}</span>
                  </span>
                  <span class="flex items-center justify-between gap-2 mt-0.5">
                    <span class="text-[10px] text-slate-500 truncate">${escapeHtml(conversation.lastMessagePreview || 'No messages yet')}</span>
                    ${conversation.unreadCount ? `<span class="min-w-4 h-4 px-1 rounded-full bg-emerald-500 text-white text-[9px] font-bold flex items-center justify-center">${conversation.unreadCount}</span>` : ''}
                  </span>
                </span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderWhatsAppMessages() {
      const messages = state.whatsapp.messages || [];
      if (state.whatsapp.messagesLoading && !messages.length) return renderWhatsAppSkeleton();
      if (!messages.length) {
        return `
          <div class="py-14 px-4 text-center">
            <div class="w-12 h-12 rounded-2xl bg-purple-100 text-purple-700 flex items-center justify-center mx-auto mb-2">
              <i data-lucide="message-square" class="w-6 h-6"></i>
            </div>
            <h3 class="text-xs font-bold text-slate-900">Start the conversation</h3>
            <p class="text-[11px] text-surface-muted max-w-xs mx-auto mt-1">Incoming customer messages will appear here.</p>
          </div>
        `;
      }
      return messages.map(renderWhatsAppMessageBubble).join('');
    }

    function renderWhatsAppMessageBubble(message) {
      const isClient = message.direction === 'outbound';
      const mediaUrl = message.mediaUrl ? `${HAVCAN_API_BASE_URL}${message.mediaUrl}` : '';
      const media = mediaUrl
        ? (String(message.mediaMimeType || '').startsWith('video')
          ? `<div class="rounded-xl overflow-hidden mb-1.5 bg-black border border-white/10 max-h-52"><video src="${escapeHtml(mediaUrl)}" controls class="w-full h-auto object-cover"></video></div>`
          : `<div class="rounded-xl overflow-hidden mb-1.5 bg-slate-900 border border-white/10 max-h-56 cursor-pointer relative group" onclick="openPhotoViewer('${escapeHtml(mediaUrl)}', '')"><img src="${escapeHtml(mediaUrl)}" class="w-full h-auto object-cover" alt="WhatsApp attachment"/><div class="absolute bottom-1.5 right-1.5 bg-black/70 text-white text-[9px] px-1.5 py-0.5 rounded flex items-center gap-1"><i data-lucide="maximize-2" class="w-2.5 h-2.5"></i><span>View</span></div></div>`)
        : '';
      const text = message.content ? `<p class="leading-relaxed break-words font-medium whitespace-pre-wrap">${escapeHtml(message.content)}</p>` : '';
      return `
        <div class="flex flex-col ${isClient ? 'items-end' : 'items-start'}" data-testid="whatsapp-message-${escapeHtml(message.id)}">
          <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs ${isClient ? 'bg-purple-950 text-white rounded-tr-xs shadow-md border border-purple-800/40' : 'bg-white text-slate-800 rounded-tl-xs border border-surface-border shadow-xs'}">
            ${media}${text}
          </div>
          <div class="flex items-center gap-1.5 mt-0.5 px-1 text-[9px] text-slate-400">
            <span>${whatsappTime(message.occurredAt)}</span>
            ${isClient ? `<span class="text-purple-400">${escapeHtml(message.status || 'sent')}</span>` : ''}
          </div>
        </div>
      `;
    }

    function renderWhatsAppInbox() {
      const active = whatsappActiveConversation();
      const contextService = state.services.find(service => service.id === state.whatsappContextServiceId);
      const contextShowcase = SHOWCASE_WORK.find(work => work.id === state.whatsappContextShowcaseId);
      const status = state.whatsapp.status;
      return `
        <div class="flex flex-col h-[calc(100dvh-64px)] -mx-4 -my-3.5 relative bg-[#FAF9FC] overflow-hidden">
          <div id="chat-messages-container" class="flex-1 overflow-y-auto px-3.5 pt-3 pb-24 space-y-3 text-xs">
            <div class="rounded-2xl ${status && status.connected ? 'bg-emerald-50 border-emerald-200' : 'bg-purple-50 border-purple-200'} border p-3 shadow-2xs flex items-center gap-2">
              <span class="w-2 h-2 rounded-full ${status && status.connected ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
              <span class="text-[10px] uppercase tracking-wider font-extrabold text-slate-800">${whatsappStatusCopy()}</span>
              ${status && status.connected ? '<i data-lucide="refresh-cw" class="w-3 h-3 text-emerald-700 ml-auto"></i>' : ''}
            </div>
            ${contextService ? `
              <div class="bg-purple-50 border border-purple-200/80 rounded-2xl p-3 shadow-2xs space-y-1.5 my-1">
                <div class="flex items-center space-x-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5 text-accent"></i><span class="text-[10px] uppercase tracking-wider font-extrabold text-purple-900">Service context</span></div>
              <p class="text-[11px] text-slate-800 leading-snug"><b>${escapeHtml(contextShowcase ? contextShowcase.title : contextService.title)}</b>${contextShowcase ? ` for ${escapeHtml(contextService.title)}` : ''} — linked to this WhatsApp conversation.</p>
              </div>
            ` : ''}
            <div class="bg-white/90 border border-purple-200/80 rounded-2xl p-3 shadow-2xs space-y-2 my-1">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[11px] font-extrabold text-slate-950">WhatsApp inbox</span>
                <span class="text-[10px] text-slate-500">${state.whatsapp.conversations.length} ${state.whatsapp.conversations.length === 1 ? 'conversation' : 'conversations'}</span>
              </div>
              ${state.whatsapp.loading && !state.whatsapp.conversations.length ? renderWhatsAppSkeleton() : renderWhatsAppConversationList()}
            </div>
            ${state.whatsapp.error ? `<div class="rounded-2xl bg-rose-50 border border-rose-200 p-3 text-[11px] text-rose-800 flex items-center justify-between gap-2"><span>${escapeHtml(state.whatsapp.error)}</span><button type="button" onclick="loadWhatsAppInbox()" class="font-bold underline">Retry</button></div>` : ''}
            ${active ? `
              <div class="flex items-center gap-2 pt-1">
                <span class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center"><i data-lucide="message-circle" class="w-4 h-4"></i></span>
                <span class="text-[11px] font-extrabold text-slate-900">${escapeHtml(active.displayName || active.waId)}</span>
                <span class="text-[10px] text-slate-400">${escapeHtml(active.waId)}</span>
              </div>
              ${renderWhatsAppMessages()}
            ` : `
              <div class="py-12 text-center text-[11px] text-slate-500">Choose a WhatsApp conversation to view messages.</div>
            `}
          </div>
        </div>
      `;
    }

    async function loadWhatsAppInbox() {
      const inbox = state.whatsapp;
      inbox.loading = true;
      inbox.error = null;
      if (state.currentRoute === 'chat') renderApp();
      try {
        const [status, conversations] = await Promise.all([
          whatsappRequest('/api/whatsapp/status'),
          whatsappRequest('/api/whatsapp/conversations')
        ]);
        inbox.status = status;
        inbox.conversations = Array.isArray(conversations) ? conversations : [];
        if (!inbox.activeConversationId || !inbox.conversations.some(item => item.id === inbox.activeConversationId)) {
          inbox.activeConversationId = inbox.conversations[0] ? inbox.conversations[0].id : null;
        }
        if (inbox.activeConversationId) await loadWhatsAppMessages(false);
      } catch (error) {
        inbox.error = error.message || 'WhatsApp could not be loaded.';
      } finally {
        inbox.loading = false;
        if (state.currentRoute === 'chat') {
          renderApp();
          setTimeout(scrollWhatsAppMessagesToBottom, 40);
        }
      }
    }

    async function loadWhatsAppMessages(shouldRender = true) {
      const conversation = whatsappActiveConversation();
      if (!conversation) {
        state.whatsapp.messages = [];
        return;
      }
      state.whatsapp.messagesLoading = true;
      try {
        const messages = await whatsappRequest(`/api/whatsapp/conversations/${encodeURIComponent(conversation.id)}/messages`);
        state.whatsapp.messages = Array.isArray(messages) ? messages : [];
        state.whatsapp.error = null;
      } catch (error) {
        state.whatsapp.error = error.message || 'Messages could not be loaded.';
      } finally {
        state.whatsapp.messagesLoading = false;
        if (shouldRender && state.currentRoute === 'chat') {
          refreshWhatsAppMessagesDOM();
          syncWhatsAppHeader();
        }
      }
    }

    function selectWhatsAppConversation(conversationId) {
      state.whatsapp.activeConversationId = conversationId;
      state.whatsapp.messages = [];
      renderApp();
      loadWhatsAppMessages(true);
    }

    function syncWhatsAppHeader() {
      const active = whatsappActiveConversation();
      const title = document.getElementById('chat-header-title');
      const subtitle = document.getElementById('chat-header-subtitle');
      if (title) title.innerText = active ? (active.displayName || active.waId) : 'WhatsApp inbox';
      if (subtitle) subtitle.innerText = active ? `${active.waId} • ${whatsappStatusCopy()}` : whatsappStatusCopy();
    }

    function startWhatsAppPolling() {
      const inbox = state.whatsapp;
      if (inbox.pollTimer || state.currentRoute !== 'chat') return;
      inbox.pollTimer = setInterval(async () => {
        if (state.currentRoute !== 'chat') return;
        try {
          const conversations = await whatsappRequest('/api/whatsapp/conversations');
          inbox.conversations = Array.isArray(conversations) ? conversations : [];
          if (state.currentRoute === 'chat') renderApp();
        } catch (error) {
          inbox.error = error.message || 'WhatsApp could not be refreshed.';
        }
      }, 8000);
      inbox.messagePollTimer = setInterval(() => {
        if (state.currentRoute === 'chat' && whatsappActiveConversation()) loadWhatsAppMessages(true);
      }, 6000);
    }

    function stopWhatsAppPolling() {
      const inbox = state.whatsapp;
      if (inbox.pollTimer) clearInterval(inbox.pollTimer);
      if (inbox.messagePollTimer) clearInterval(inbox.messagePollTimer);
      inbox.pollTimer = null;
      inbox.messagePollTimer = null;
    }

    function scrollWhatsAppMessagesToBottom() {
      const container = document.getElementById('chat-messages-container');
      if (container) container.scrollTop = container.scrollHeight;
    }

    function refreshWhatsAppMessagesDOM() {
      if (state.currentRoute !== 'chat') return;
      renderApp();
      setTimeout(scrollWhatsAppMessagesToBottom, 40);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      updateBottomBarPosition(false);
      delayedCollapseNavBar(2200);
      document.addEventListener('pointerdown', createTapRipple, { passive: true });
      const navContainer = document.getElementById('bottom-bar-container');
      if (navContainer && 'ResizeObserver' in window) {
        const navObserver = new ResizeObserver(() => updateBottomBarPosition(false));
        navObserver.observe(navContainer);
      }
      window.addEventListener('resize', () => updateBottomBarPosition(false));
    });
</script>
</body></html>
